name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the coverage badge to the badges branch
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

      # Fork PRs get a read-only token, so only publish for branches of this repo.
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          files: target/surefire-reports/*.xml
          comment_title: Test Results

      - name: Compute line coverage
        id: coverage
        run: |
          pct=$(awk -F, 'NR>1{m+=$8;c+=$9} END{printf "%.0f", c*100/(m+c)}' target/site/jacoco/jacoco.csv)
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "### Line coverage: ${pct}%" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          PCT: ${{ steps.coverage.outputs.pct }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PCT" -ge 80 ]; then color=brightgreen; elif [ "$PCT" -ge 60 ]; then color=yellow; else color=red; fi
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" badges > /dev/null; then
            git clone --depth 1 --branch badges "$url" "$RUNNER_TEMP/badges"
          else
            git init -b badges "$RUNNER_TEMP/badges"
          fi
          cd "$RUNNER_TEMP/badges"
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$color" > coverage.json
          git add coverage.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore: update coverage badge to ${PCT}%"
            git push "$url" HEAD:badges
          fi
